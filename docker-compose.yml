# CyberFlares — backend stack.
# Frontend runs natively via `npm run dev` (see frontend/README.md).

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cf-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cf-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/scripts:/app/scripts:ro
      # Bind-mount the data dir directly — so files dropped into
      # backend/data/precomputed/... on Windows are visible instantly
      # inside the container.
      - ./backend/data:/app/data
      - ${USERPROFILE}/.config/earthengine:/root/.config/earthengine:ro
    depends_on:
      redis:      { condition: service_healthy }
      postgis:    { condition: service_healthy }
      minio:      { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cf-worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=2
    env_file: ./backend/.env
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/scripts:/app/scripts:ro
      - ./backend/data:/app/data
      - ${USERPROFILE}/.config/earthengine:/root/.config/earthengine:ro
    depends_on:
      redis:      { condition: service_healthy }
      postgis:    { condition: service_healthy }
      minio:      { condition: service_healthy }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cf-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgis:
    image: postgis/postgis:16-3.4
    container_name: cf-postgis
    environment:
      POSTGRES_USER: cyberflares
      POSTGRES_PASSWORD: cyberflares
      POSTGRES_DB: cyberflares
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberflares -d cyberflares"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: cf-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cfadmin
      MINIO_ROOT_PASSWORD: cfadmincfadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    container_name: cf-flower
    command: celery --broker=redis://redis:6379/1 flower --port=5555
    ports: ["5555:5555"]
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  # sim_data volume removed — data now bind-mounted from ./backend/data
