# CyberFlares — Nginx reverse proxy.
# Landing page:  http://localhost/
# React app:     http://localhost/app/
# FastAPI:       http://localhost/api/*
# Direct Vite:   http://localhost:5173/  (bypasses nginx, useful for HMR)

upstream cf_api      { server api:8000; }
upstream cf_frontend { server frontend:5173; }

server {
    listen 80;
    server_name _;

    client_max_body_size 2G;

    # ── Landing / ──
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    # ── React app at /app/ ── proxied to Vite dev-server
    location /app/ {
        proxy_pass         http://cf_frontend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";     # Vite HMR websocket
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # ── API ──
    location /api/ {
        proxy_pass         http://cf_api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    location = /docs  { return 302 /api/docs; }
    location = /redoc { return 302 /api/redoc; }
}
