# CyberFlares — nginx reverse proxy.
# Serves the landing page and proxies /api/* to FastAPI.
# The frontend now runs natively via `npm run dev` (see frontend/README.md);
# open it directly at http://localhost:5173/.

upstream cf_api { server api:8000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 2G;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://cf_api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    location = /docs  { return 302 /api/docs; }
    location = /redoc { return 302 /api/redoc; }
}
